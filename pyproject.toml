[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-pipeline"
version = "0.3.1rc2"
description = "Industrial-grade Xiaohongshu research, multi-driver crawling, reproducibility manifests, and Obsidian PKM pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Engineering", email = "engineering@antigravity.ai" }
]
keywords = ["xiaohongshu", "scraper", "agent-skill", "obsidian", "mediacrawler", "cdp", "pkm", "resilience", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "playwright>=1.40.0",
    "aiofiles>=23.2.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
xhs-pipeline = "scripts.run_pipeline:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
